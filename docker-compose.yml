services:
  postgres:
    image: postgres:16-alpine
    container_name: levan-postgres
    environment:
      POSTGRES_USER: levan
      POSTGRES_PASSWORD: levan
      POSTGRES_DB: levan_dev
    ports:
      - "5432:5432"
    volumes:
      - levan_postgres_data:/var/lib/postgresql/data

volumes:
  levan_postgres_data:
